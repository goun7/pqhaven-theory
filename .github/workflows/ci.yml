name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Kurulum
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Testler
        # G48-2026-10-22: once `pytest`-cagrisi-exit-127-veriyordu ( PATH-
        # yerele-bagli). `python -m pytest`-her-zaman-kurulu-modulu-bulur.
        run: python -m pytest tests/ -q
